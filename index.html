<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réseau Social</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/feed.css" />
  </head>
  <body>
    <div id="app">
      <header id="main-nav" class="navbar" style="display: none">
        <div class="navbar-brand">Réseau Social</div>
        <nav class="navbar-links">
          <a href="#accueil">Accueil</a>
          <a href="#amis">Amis</a>
          <a href="#chat">Messages</a>
          <a href="#profil">Profil</a>
          <button
            id="notifications-toggle"
            type="button"
            aria-label="Notifications"
          >
            Notifications <span id="notifications-count" hidden>0</span>
          </button>
          <button id="btn-logout">Déconnexion</button>
        </nav>
      </header>

      <aside id="notifications-panel" class="notifications-panel" hidden>
        <div class="notifications-heading">
          <strong>Notifications</strong>
          <button id="notifications-mark-read" type="button">
            Tout marquer comme lu
          </button>
        </div>
        <div id="notifications-list"></div>
      </aside>

      <main id="page-content"></main>

      <footer id="main-footer" style="display: none">
        <p>&copy; 2026 Réseau Social — Projet ESGIS</p>
      </footer>
    </div>

    <!-- Ordre important : api.js en premier (définit apiRequest), app.js en second (définit le router) -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/chat.js"></script>
    <script src="assets/js/comments.js"></script>
    <script src="assets/js/feed.js?v=2"></script>
    <script src="assets/js/friends.js"></script>
    <script src="assets/js/profile.js"></script>
    <script src="assets/js/notifications.js"></script>
  </body>
</html>
